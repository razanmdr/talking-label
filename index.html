<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talking Label</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --green:#0BA34E; --green-d:#08823E; --green-w:#F0FAF4;
    --ink:#101418; --sub:#5B6470; --faint:#9AA3AD;
    --line:#EDEFF2; --bg:#FBFCFD; --card:#FFFFFF;
    --no:#E5484D; --warn:#E0912A;
  }
  body{
    font-family:'Inter',system-ui,sans-serif; color:var(--ink);
    background:var(--card); min-height:100vh;
  }
  .phone{
    width:100%; max-width:520px; min-height:100vh; margin:0 auto; background:var(--card);
    display:flex; flex-direction:column; position:relative;
  }
  @media(min-width:640px){
    body{background:#EEF1F4; display:flex; align-items:center; justify-content:center; padding:24px;}
    .phone{min-height:0; height:auto; max-width:440px; border-radius:28px; overflow:hidden;
      box-shadow:0 20px 60px rgba(16,20,24,.14); border:1px solid #E4E8EC; min-height:720px;}
  }
  .screen{flex:1;display:none;flex-direction:column;min-height:0;}
  .screen.active{display:flex;}
  .material-symbols-rounded{font-variation-settings:'wght' 400;}

  /* ---------- welcome ---------- */
  .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(40px + env(safe-area-inset-top)) 34px 40px;text-align:center;}
  .brandtag{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:40px;}
  .check{width:56px;height:56px;border-radius:50%;background:var(--green-w);display:flex;align-items:center;justify-content:center;margin-bottom:26px;}
  .check .material-symbols-rounded{font-size:30px;color:var(--green);font-variation-settings:'wght' 500;}
  .scanned{font-size:13px;color:var(--sub);margin-bottom:22px;letter-spacing:.01em;}
  .illus{width:150px;height:150px;margin-bottom:26px;display:flex;align-items:center;justify-content:center;}
  .illus svg{width:120px;height:120px;}
  .thumb svg{width:34px;height:34px;}
  .pname{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;}
  .pmeta{display:inline-flex;gap:8px;margin-bottom:44px;}
  .pmeta span{font-size:12px;font-weight:600;color:var(--sub);background:var(--bg);border:1px solid var(--line);padding:5px 11px;border-radius:99px;}
  .cta{width:100%;max-width:280px;background:var(--green);color:#fff;border:0;border-radius:16px;padding:17px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .18s,transform .12s;}
  .cta:hover{background:var(--green-d);}
  .cta:active{transform:scale(.98);}

  /* ---------- product screen ---------- */
  .top{padding:calc(22px + env(safe-area-inset-top)) 24px 18px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--sub);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;padding:0;margin-bottom:16px;}
  .back .material-symbols-rounded{font-size:18px;}
  .prodrow{display:flex;align-items:center;gap:14px;}
  .thumb{width:54px;height:54px;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .prodrow h1{font-size:19px;font-weight:700;letter-spacing:-.01em;}
  .prodrow .m{font-size:12.5px;color:var(--faint);margin-top:2px;}

  .body{flex:1;overflow-y:auto;padding:20px 24px 24px;min-height:0;display:flex;flex-direction:column;}
  .body::-webkit-scrollbar{width:0;}

  .seg{display:flex;gap:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:22px;}
  .seg button{flex:1;border:0;background:none;font-family:inherit;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;transition:.18s;}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(16,20,24,.08);}

  .hint{font-size:12px;font-weight:500;color:var(--faint);margin-bottom:14px;letter-spacing:.01em;}

  .list{display:flex;flex-direction:column;gap:2px;}
  .opt{display:flex;align-items:center;gap:14px;padding:15px 4px;border:0;border-bottom:1px solid var(--line);background:none;font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;text-align:left;width:100%;transition:.15s;}
  .opt:last-child{border-bottom:0;}
  .opt .material-symbols-rounded{font-size:22px;color:var(--faint);transition:.15s;width:24px;text-align:center;flex-shrink:0;}
  .opt .txt{flex:1;}
  .opt .chev{font-size:20px;color:#C7CDD4;}
  .opt:hover{color:var(--green-d);}
  .opt:hover .material-symbols-rounded{color:var(--green);}
  .opt.sel{color:var(--green-d);font-weight:600;}
  .opt.sel .material-symbols-rounded{color:var(--green);}
  .opt.sel .chev{color:var(--green);}

  /* result */
  .result{margin-top:20px;border:1px solid var(--line);border-radius:18px;padding:20px;display:none;flex-direction:column;gap:14px;background:var(--card);}
  .result.show{display:flex;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .rrow{display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.5;color:var(--ink);}
  .rrow .material-symbols-rounded{font-size:20px;flex-shrink:0;margin-top:1px;}
  .rrow.ok .material-symbols-rounded{color:var(--green);}
  .rrow.no .material-symbols-rounded{color:var(--no);}
  .rrow.no{color:var(--no);}
  .rrow.warn .material-symbols-rounded{color:var(--warn);}
  .playing{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;color:var(--green);padding-bottom:2px;}
  .bars{display:inline-flex;gap:3px;align-items:flex-end;height:15px;}
  .bars i{width:3px;background:var(--green);border-radius:2px;animation:eq .9s infinite;}
  .bars i:nth-child(1){height:6px;animation-delay:0s;}
  .bars i:nth-child(2){height:14px;animation-delay:.2s;}
  .bars i:nth-child(3){height:9px;animation-delay:.4s;}
  .bars i:nth-child(4){height:12px;animation-delay:.15s;}
  @keyframes eq{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}

  /* footer controls */
  .foot{flex-shrink:0;padding:16px 24px 22px;border-top:1px solid var(--line);background:var(--card);}
  .voice{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .voice label{font-size:11px;font-weight:500;color:var(--faint);white-space:nowrap;}
  .voice select{flex:1;font-family:inherit;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);outline:none;}
  .play{width:100%;background:var(--green);color:#fff;border:0;border-radius:16px;padding:16px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .18s,transform .12s;}
  .play .material-symbols-rounded{font-size:20px;}
  .play:hover{background:var(--green-d);}
  .play:active{transform:scale(.99);}
  .play:disabled{background:#E6E9EC;color:var(--faint);cursor:not-allowed;}
</style>
</head>
<body>
<div class="phone">

  <!-- WELCOME -->
  <div class="screen active" id="s1">
    <div class="welcome">
      <div class="brandtag">Smart Store · EAH Jena</div>
      <div class="check"><span class="material-symbols-rounded">check</span></div>
      <div class="scanned">Gescanntes Produkt</div>
      <div class="illus" id="illus"></div>
      <div class="pname" data-pname>Protein Bar</div>
      <div class="pmeta"><span id="mPrice">€ 2,49</span><span id="mSize">50 g</span><span id="mDisc">−25 %</span></div>
      <button class="cta" onclick="go('s2')">Produktinfos ansehen</button>
    </div>
  </div>

  <!-- PRODUCT -->
  <div class="screen" id="s2">
    <div class="top">
      <button class="back" onclick="reset()"><span class="material-symbols-rounded">arrow_back</span> Erneut scannen</button>
      <div class="prodrow">
        <div class="thumb" id="thumb"></div>
        <div>
          <h1 data-pname>Protein Bar</h1>
          <div class="m" data-pmetaline>€ 2,49 · 50 g · −25 %</div>
        </div>
      </div>
    </div>
    <div class="body">
      <div class="seg">
        <button id="segNew" class="on" onclick="setSeg('new')">Erstkäufer</button>
        <button id="segRet" onclick="setSeg('return')">Stammkunde</button>
      </div>
      <div class="hint" id="hint">Wähle, was dich interessiert</div>
      <div class="list" id="list"></div>
      <div class="result" id="result"></div>
    </div>
    <div class="foot">
      <div class="voice"><label>Stimme</label><select id="voiceSel"></select></div>
      <button class="play" id="playBtn" onclick="speak()" disabled>
        <span class="material-symbols-rounded">volume_up</span> Information anhören
      </button>
    </div>
  </div>
</div>

<script>
// ===== PRODUKT-DATENBANK (mehrere Produkte) =====
const PRODUCTS = {
  protein: {
    name:"Protein Bar",
    price:"€ 2,49", size:"50 g", disc:"−25 %",
    svg:`<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="16" y="44" width="88" height="42" rx="10" fill="#C68A4E"/>
      <rect x="16" y="44" width="88" height="18" rx="10" fill="#D9A46A"/>
      <rect x="22" y="50" width="76" height="30" rx="6" fill="#B07C42" opacity="0.3"/>
      <circle cx="36" cy="68" r="3.5" fill="#5A3A1E"/><circle cx="54" cy="60" r="3" fill="#5A3A1E"/>
      <circle cx="72" cy="70" r="3.5" fill="#5A3A1E"/><circle cx="86" cy="59" r="2.6" fill="#5A3A1E"/>
      <circle cx="46" cy="75" r="2.4" fill="#5A3A1E"/><circle cx="64" cy="76" r="2.4" fill="#5A3A1E"/>
      <path d="M16 54 Q60 38 104 54" stroke="#fff" stroke-width="2.5" opacity="0.4" fill="none"/></svg>`,
    data:{
      vegan:{txt:"Dieser Protein Bar ist vegan und enthält keine tierischen Inhaltsstoffe.",icon:"eco",cls:"ok",show:"Vegan – keine tierischen Zutaten"},
      halal:{txt:"Dieses Produkt ist halal-zertifiziert und enthält weder Schweinefleisch noch Alkohol.",icon:"verified",cls:"ok",show:"Halal-zertifiziert"},
      bio:{txt:"Dieses Produkt trägt das EU-Bio-Siegel. Die Zutaten stammen aus kontrolliert biologischem Anbau.",icon:"compost",cls:"ok",show:"EU-Bio-zertifiziert"},
      alter:{txt:"Für dieses Produkt gibt es keine Altersbeschränkung. Es ist für alle Altersgruppen geeignet.",icon:"check_circle",cls:"ok",show:"Keine Altersbeschränkung"},
      nuts:{txt:"Achtung: Dieses Produkt enthält Erdnüsse sowie Spuren von Gluten und Soja.",icon:"warning",cls:"no",show:"Enthält Erdnüsse, Spuren von Gluten & Soja"},
      naehzu:{txt:"Nährwerte pro Riegel: zweihundertzehn Kilokalorien, zwanzig Gramm Protein, sechs Gramm Zucker und neun Gramm Fett. Zutaten: Sojaprotein, Erdnüsse, Datteln, Kakao, Reissirup und natürliches Aroma.",icon:"nutrition",cls:"ok",show:"210 kcal · 20g Protein · 6g Zucker · 9g Fett · Sojaprotein, Erdnüsse, Datteln, Kakao"},
      date:{txt:"Das Produkt ist haltbar bis zum zwölften August zweitausendsechsundzwanzig. Chargennummer L fünfundzwanzig.",icon:"event",cls:"warn",show:"Haltbar bis 12.08.2026 · Charge L25"},
      recycle:{txt:"Die Verpackung besteht aus recycelbarem Kunststoff und gehört in den gelben Sack. Bitte trennen Sie Folie und Karton.",icon:"recycling",cls:"ok",show:"Gelber Sack · Folie & Karton trennen"},
      rating:{txt:"Dieses Produkt hat eine Bewertung von vier Komma acht Sternen bei einhundertvierundzwanzig Rezensionen.",icon:"star",cls:"ok",show:"4,8 / 5,0 · 124 Rezensionen"},
    }
  },
  snack: {
    name:"Snack Bar",
    price:"€ 1,89", size:"40 g", disc:"−10 %",
    svg:`<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="16" y="46" width="88" height="38" rx="9" fill="#E0B357"/>
      <rect x="16" y="46" width="88" height="15" rx="9" fill="#EDC877"/>
      <rect x="22" y="52" width="76" height="26" rx="5" fill="#CFA043" opacity="0.35"/>
      <rect x="30" y="60" width="7" height="7" rx="1.5" fill="#8A5A2B"/>
      <rect x="46" y="66" width="7" height="7" rx="1.5" fill="#8A5A2B"/>
      <rect x="62" y="59" width="7" height="7" rx="1.5" fill="#8A5A2B"/>
      <rect x="78" y="66" width="7" height="7" rx="1.5" fill="#8A5A2B"/>
      <circle cx="40" cy="72" r="2.2" fill="#6B4420"/><circle cx="72" cy="72" r="2.2" fill="#6B4420"/>
      <path d="M16 56 Q60 42 104 56" stroke="#fff" stroke-width="2.5" opacity="0.4" fill="none"/></svg>`,
    data:{
      vegan:{txt:"Dieser Snack Bar ist nicht vegan, da er Honig und Milchpulver enthält.",icon:"eco",cls:"no",show:"Nicht vegan – enthält Honig & Milchpulver"},
      halal:{txt:"Dieses Produkt ist halal-zertifiziert.",icon:"verified",cls:"ok",show:"Halal-zertifiziert"},
      bio:{txt:"Dieses Produkt ist nicht Bio-zertifiziert.",icon:"compost",cls:"no",show:"Keine Bio-Zertifizierung"},
      alter:{txt:"Für dieses Produkt gibt es keine Altersbeschränkung.",icon:"check_circle",cls:"ok",show:"Keine Altersbeschränkung"},
      nuts:{txt:"Achtung: Dieses Produkt enthält Haselnüsse und Milch. Es kann Spuren von Gluten enthalten.",icon:"warning",cls:"no",show:"Enthält Haselnüsse & Milch, Spuren von Gluten"},
      naehzu:{txt:"Nährwerte pro Riegel: einhundertachtzig Kilokalorien, vier Gramm Protein, zwölf Gramm Zucker und sieben Gramm Fett. Zutaten: Haferflocken, Honig, Haselnüsse, Milchpulver und Rosinen.",icon:"nutrition",cls:"ok",show:"180 kcal · 4g Protein · 12g Zucker · 7g Fett · Haferflocken, Honig, Haselnüsse, Milch"},
      date:{txt:"Das Produkt ist haltbar bis zum dritten Mai zweitausendsechsundzwanzig. Chargennummer S zwölf.",icon:"event",cls:"warn",show:"Haltbar bis 03.05.2026 · Charge S12"},
      recycle:{txt:"Die Verpackung ist aus Papier und gehört in die Altpapiertonne.",icon:"recycling",cls:"ok",show:"Altpapiertonne · Verpackung aus Papier"},
      rating:{txt:"Dieses Produkt hat eine Bewertung von vier Komma zwei Sternen bei siebenundachtzig Rezensionen.",icon:"star",cls:"ok",show:"4,2 / 5,0 · 87 Rezensionen"},
    }
  }
};

// pick product from URL: ?produkt=protein  or  ?produkt=snack
const params = new URLSearchParams(location.search);
const key = (params.get('produkt') || 'protein').toLowerCase();
const P = PRODUCTS[key] || PRODUCTS.protein;
const DB = P.data;

// render product identity into the page
function renderIdentity(prod){
  document.getElementById('illus').innerHTML = prod.svg;
  document.getElementById('thumb').innerHTML = prod.svg;
  document.querySelectorAll('[data-pname]').forEach(e=>e.textContent = prod.name);
  document.querySelectorAll('[data-pmetaline]').forEach(e=>e.textContent = `${prod.price} · ${prod.size} · ${prod.disc}`);
  document.getElementById('mPrice').textContent = prod.price;
  document.getElementById('mSize').textContent = prod.size;
  document.getElementById('mDisc').textContent = prod.disc;
}
renderIdentity(P);

// ===== OPTIONAL: Google Sheets als Datenbank =====
// Trage hier den CSV-Link aus "Im Web veröffentlichen" ein.
// Leer lassen = eingebaute Daten werden verwendet (funktioniert offline).
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmUpaLCIMK9OnbILTVyUVKzYZpINPDZgjwjiPk0Ble20IelcyTVKw2LKp6-mRxRXVthUvfm_M3-Eop/pub?gid=0&single=true&output=csv"; // z.B. "https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?output=csv"

function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true; else if(c===',') {row.push(cur);cur="";}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";}
      else if(c!=='\r') cur+=c; }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function yesno(v,pos,neg){ return (v||"").trim().toLowerCase()==="ja"
  ? {mark:pos,cls:"ok"} : {mark:neg,cls:"no"}; }

async function loadFromSheet(){
  if(!SHEET_CSV_URL) return; // no sheet configured -> keep built-in data
  try{
    const res = await fetch(SHEET_CSV_URL, {cache:"no-store"});
    if(!res.ok) throw 0;
    const rows = parseCSV(await res.text());
    const head = rows[0].map(h=>h.trim().toLowerCase());
    const idx = n=>head.indexOf(n);
    const rec = rows.slice(1).find(r=>(r[idx("produkt")]||"").trim().toLowerCase()===key);
    if(!rec) return;
    const g=n=>{const i=idx(n); return i>=0?(rec[i]||"").trim():"";};
    // update identity — "neue preis" ersetzt "preis" wenn vorhanden
    P.name=g("name")||P.name;
    const neuPreis = g("neue preis") || g("preis");
    P.price="€ "+(neuPreis||"").replace("€","").trim();
    P.size=g("size")||P.size;
    P.disc=g("rabatt")||P.disc;
    P.link=g("link")||"";
    renderIdentity(P);
    // update data fields
    const veg=yesno(g("vegan"),"eco","warning");
    DB.vegan={txt:g("vegan").toLowerCase()==="ja"?"Dieses Produkt ist vegan.":"Dieses Produkt ist nicht vegan.",icon:veg.mark,cls:veg.cls,show:g("vegan").toLowerCase()==="ja"?"Vegan":"Nicht vegan"};
    const hal=yesno(g("halal"),"verified","warning");
    DB.halal={txt:g("halal").toLowerCase()==="ja"?"Dieses Produkt ist halal-zertifiziert.":"Dieses Produkt ist nicht halal-zertifiziert.",icon:hal.mark,cls:hal.cls,show:g("halal").toLowerCase()==="ja"?"Halal-zertifiziert":"Nicht halal"};
    const bio=yesno(g("bio"),"compost","warning");
    DB.bio={txt:g("bio").toLowerCase()==="ja"?"Dieses Produkt trägt das EU-Bio-Siegel.":"Dieses Produkt ist nicht Bio-zertifiziert.",icon:bio.mark,cls:bio.cls,show:g("bio").toLowerCase()==="ja"?"EU-Bio-zertifiziert":"Keine Bio-Zertifizierung"};
    if(g("allergene")) DB.nuts={txt:"Achtung: Dieses Produkt enthält "+g("allergene")+".",icon:"warning",cls:"no",show:"Enthält: "+g("allergene")};
    if(g("naehrwerte")) DB.naehzu={txt:"Nährwerte und Zutaten: "+g("naehrwerte")+".",icon:"nutrition",cls:"ok",show:g("naehrwerte")};
    if(g("verfallsdatum")) DB.date={txt:"Haltbar bis "+g("verfallsdatum")+".",icon:"event",cls:"warn",show:"Haltbar bis "+g("verfallsdatum")};
    if(g("entsorgung")) DB.recycle={txt:"Entsorgung: "+g("entsorgung")+".",icon:"recycling",cls:"ok",show:g("entsorgung")};
    if(g("rating")) DB.rating={txt:"Bewertung: "+g("rating")+" von fünf Sternen.",icon:"star",cls:"ok",show:g("rating")+" / 5,0"};
  }catch(e){ /* offline or error -> built-in data stays */ }
}
loadFromSheet();
const GROUPS={
  new:[["vegan","eco","Vegan"],["halal","verified","Halal"],["bio","compost","Bio / Organik"],["alter","shield_person","Altersbeschränkung"],["nuts","warning","Allergene"],["naehzu","nutrition","Nährwerte & Zutaten"],["allnew","frame_inspect","Alle Eigenschaften"]],
  return:[["date","event","Verfallsdatum & Charge"],["recycle","recycling","Entsorgung & Recycling"],["rating","star","Bewertungen"],["allret","frame_inspect","Alle Infos"]],
};
const HINTS={new:"Eigenschaften – was ist drin?",return:"Kurz geprüft – das Wesentliche"};

let seg="new",chosen=null;
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function clearR(){const r=document.getElementById('result');r.classList.remove('show');r.innerHTML='';}
function reset(){chosen=null;clearR();document.getElementById('playBtn').disabled=true;if('speechSynthesis'in window)speechSynthesis.cancel();setSeg('new');go('s1');}
function setSeg(s){seg=s;chosen=null;clearR();document.getElementById('playBtn').disabled=true;
  document.getElementById('segNew').classList.toggle('on',s==='new');
  document.getElementById('segRet').classList.toggle('on',s==='return');
  document.getElementById('hint').textContent=HINTS[s];render();}
function render(){
  document.getElementById('list').innerHTML=GROUPS[seg].map(([k,ic,lb])=>
    `<button class="opt" data-k="${k}" onclick="sel(this)"><span class="material-symbols-rounded">${ic}</span><span class="txt">${lb}</span><span class="material-symbols-rounded chev">chevron_right</span></button>`).join('');
}
function sel(el){document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');chosen=el.dataset.k;document.getElementById('playBtn').disabled=false;clearR();}
function lines(){
  if(chosen==="allnew")return[DB.vegan,DB.halal,DB.bio,DB.alter,DB.nuts,DB.naehzu];
  if(chosen==="allret")return[DB.date,DB.recycle,DB.rating];
  return[DB[chosen]];
}
let best=null;
const RANK=["Anna (Premium)","Anna (Enhanced)","Petra (Premium)","Petra (Enhanced)","Markus (Premium)","Google Deutsch","Microsoft Katja","Microsoft Hedda","Anna","Petra","Markus"];
function pick(){const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith("de"));if(!vs.length)return;best=null;
  for(const n of RANK){const m=vs.find(v=>v.name.includes(n));if(m){best=m;break;}}
  if(!best)best=vs.find(v=>!/compact|eloquence/i.test(v.name))||vs[0];
  const sel=document.getElementById('voiceSel');if(sel)sel.innerHTML=vs.map(v=>`<option ${v===best?'selected':''}>${v.name}</option>`).join('');}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=pick;pick();}
function speak(){
  const rows=lines();const r=document.getElementById('result');
  r.innerHTML='<div class="playing"><span class="bars"><i></i><i></i><i></i><i></i></span> Wird vorgelesen…</div>'+
    rows.map(x=>`<div class="rrow ${x.cls}"><span class="material-symbols-rounded">${x.icon}</span><span>${x.show||x.txt}</span></div>`).join('');
  r.classList.add('show');
  if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(rows.map(x=>x.txt).join(' '));
  const sel=document.getElementById('voiceSel');let v=best;
  if(sel&&sel.value){const f=speechSynthesis.getVoices().find(x=>x.name===sel.value);if(f)v=f;}
  if(v){u.voice=v;u.lang=v.lang;}else u.lang='de-DE';u.rate=.94;u.pitch=1;
  u.onend=()=>{const p=r.querySelector('.playing');if(p)p.remove();};
  speechSynthesis.speak(u);
}
render();
</script>
</body>
</html>
