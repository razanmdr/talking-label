<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talking Label</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0" />
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --green:#0BA34E; --green-d:#08823E; --green-w:#F0FAF4;
    --ink:#101418; --sub:#5B6470; --faint:#9AA3AD;
    --line:#EDEFF2; --bg:#FBFCFD; --card:#FFFFFF;
    --no:#E5484D; --warn:#E0912A;
  }
  body{
    font-family:'Inter',system-ui,sans-serif; color:var(--ink);
    background:var(--card); min-height:100vh;
  }
  .phone{
    width:100%; max-width:520px; min-height:100vh; margin:0 auto; background:var(--card);
    display:flex; flex-direction:column; position:relative;
  }
  @media(min-width:640px){
    body{background:#EEF1F4; display:flex; align-items:center; justify-content:center; padding:24px;}
    .phone{min-height:0; height:auto; max-width:440px; border-radius:28px; overflow:hidden;
      box-shadow:0 20px 60px rgba(16,20,24,.14); border:1px solid #E4E8EC; min-height:720px;}
  }
  .screen{flex:1;display:none;flex-direction:column;min-height:0;}
  .screen.active{display:flex;}
  .material-symbols-rounded{font-variation-settings:'wght' 400;}

  /* ---------- language switcher ---------- */
  .langrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
  .langrow.top-place{margin-bottom:18px;}
  .langbtn{border:1px solid var(--line);background:var(--bg);color:var(--sub);font-family:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;cursor:pointer;transition:.15s;}
  .langbtn:hover{border-color:var(--green);color:var(--green-d);}
  .langbtn.on{background:var(--green);border-color:var(--green);color:#fff;}

  /* ---------- welcome ---------- */
  .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 34px 40px;text-align:center;}
  .brandtag{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:22px;}
  .check{width:56px;height:56px;border-radius:50%;background:var(--green-w);display:flex;align-items:center;justify-content:center;margin-bottom:26px;}
  .check .material-symbols-rounded{font-size:30px;color:var(--green);font-variation-settings:'wght' 500;}
  .scanned{font-size:13px;color:var(--sub);margin-bottom:22px;letter-spacing:.01em;}
  .illus{width:150px;height:150px;margin-bottom:26px;display:flex;align-items:center;justify-content:center;}
  .illus svg{width:120px;height:120px;}
  .thumb svg{width:34px;height:34px;}
  .pname{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;}
  .pmeta{display:inline-flex;gap:8px;margin-bottom:36px;}
  .pmeta span{font-size:12px;font-weight:600;color:var(--sub);background:var(--bg);border:1px solid var(--line);padding:5px 11px;border-radius:99px;}
  .cta{width:100%;max-width:280px;background:var(--green);color:#fff;border:0;border-radius:16px;padding:17px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .18s,transform .12s;}
  .cta:hover{background:var(--green-d);}
  .cta:active{transform:scale(.98);}

  /* ---------- product screen ---------- */
  .top{padding:calc(18px + env(safe-area-inset-top)) 24px 16px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--sub);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;padding:0;margin-bottom:14px;}
  .back .material-symbols-rounded{font-size:18px;}
  .prodrow{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .thumb{width:54px;height:54px;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .prodrow h1{font-size:19px;font-weight:700;letter-spacing:-.01em;}
  .prodrow .m{font-size:12.5px;color:var(--faint);margin-top:2px;}

  .body{flex:1;overflow-y:auto;padding:16px 24px 24px;min-height:0;display:flex;flex-direction:column;}
  .body::-webkit-scrollbar{width:0;}

  .seg{display:flex;gap:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:22px;}
  .seg button{flex:1;border:0;background:none;font-family:inherit;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;transition:.18s;}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(16,20,24,.08);}

  .hint{font-size:12px;font-weight:500;color:var(--faint);margin-bottom:14px;letter-spacing:.01em;}

  .list{display:flex;flex-direction:column;gap:2px;}
  .opt{display:flex;align-items:center;gap:14px;padding:15px 4px;border:0;border-bottom:1px solid var(--line);background:none;font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;text-align:left;width:100%;transition:.15s;}
  .opt:last-child{border-bottom:0;}
  .opt .material-symbols-rounded{font-size:22px;color:var(--faint);transition:.15s;width:24px;text-align:center;flex-shrink:0;}
  .opt .txt{flex:1;}
  .opt .chev{font-size:20px;color:#C7CDD4;}
  .opt:hover{color:var(--green-d);}
  .opt:hover .material-symbols-rounded{color:var(--green);}
  .opt.sel{color:var(--green-d);font-weight:600;}
  .opt.sel .material-symbols-rounded{color:var(--green);}
  .opt.sel .chev{color:var(--green);}

  /* result */
  .result{margin-top:20px;border:1px solid var(--line);border-radius:18px;padding:20px;display:none;flex-direction:column;gap:14px;background:var(--card);}
  .result.show{display:flex;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .rrow{display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.5;color:var(--ink);}
  .rrow .material-symbols-rounded{font-size:20px;flex-shrink:0;margin-top:1px;}
  .rrow.ok .material-symbols-rounded{color:var(--green);}
  .rrow.no .material-symbols-rounded{color:var(--no);}
  .rrow.no{color:var(--no);}
  .rrow.warn .material-symbols-rounded{color:var(--warn);}
  .playing{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;color:var(--green);padding-bottom:2px;}
  .bars{display:inline-flex;gap:3px;align-items:flex-end;height:15px;}
  .bars i{width:3px;background:var(--green);border-radius:2px;animation:eq .9s infinite;}
  .bars i:nth-child(1){height:6px;animation-delay:0s;}
  .bars i:nth-child(2){height:14px;animation-delay:.2s;}
  .bars i:nth-child(3){height:9px;animation-delay:.4s;}
  .bars i:nth-child(4){height:12px;animation-delay:.15s;}
  @keyframes eq{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}

  /* footer controls */
  .foot{flex-shrink:0;padding:14px 24px 22px;border-top:1px solid var(--line);background:var(--card);}
  .voice{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .voice label{font-size:11px;font-weight:500;color:var(--faint);white-space:nowrap;}
  .voice select{flex:1;font-family:inherit;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);outline:none;}
  .play{width:100%;background:var(--green);color:#fff;border:0;border-radius:16px;padding:16px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .18s,transform .12s;}
  .play .material-symbols-rounded{font-size:20px;}
  .play:hover{background:var(--green-d);}
  .play:active{transform:scale(.99);}
  .play:disabled{background:#E6E9EC;color:var(--faint);cursor:not-allowed;}
  .askbtn{width:100%;background:#fff;color:var(--green-d);border:1.5px solid var(--green);border-radius:16px;padding:14px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.18s;margin-bottom:10px;}
  .askbtn:hover{background:var(--green-w);}
  .askbtn .material-symbols-rounded{font-size:19px;}
  .askbtn.listening{background:var(--green);color:#fff;border-color:var(--green);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(11,163,78,.35);}50%{box-shadow:0 0 0 8px rgba(11,163,78,0);}}
  .noSpeech{font-size:11px;color:var(--faint);text-align:center;margin:-4px 0 10px;}

  /* ---------- RTL (Arabic) ---------- */
  [dir="rtl"] .opt{text-align:right;}
  [dir="rtl"] .back{flex-direction:row-reverse;}
  [dir="rtl"] .back .material-symbols-rounded{transform:scaleX(-1);}
  [dir="rtl"] .opt .chev{transform:scaleX(-1);}
  [dir="rtl"] .prodrow{flex-direction:row-reverse;text-align:right;}
  [dir="rtl"] .rrow{flex-direction:row-reverse;text-align:right;}
  [dir="rtl"] .voice{flex-direction:row-reverse;}
  [dir="rtl"] .pmeta,[dir="rtl"] .m,[dir="rtl"] #mPrice,[dir="rtl"] #mSize,[dir="rtl"] #mDisc{direction:ltr;}
</style>
</head>
<body>
<div class="phone" id="phone">

  <div class="screen active" id="s1">
    <div class="welcome">
      <div class="langrow top-place" id="langrowWelcome"></div>
      <div class="brandtag" data-i="brandtag">Smart Store · EAH Jena</div>
      <div class="check"><span class="material-symbols-rounded">check</span></div>

      <div class="pname" data-pname>Protein Bar</div>
      <div class="pmeta"><span id="mPrice">€ 2,49</span><span id="mSize">50 g</span><span id="mDisc">−25 %</span></div>
      <button class="cta" data-i="cta" onclick="go('s2')">Produktinfos ansehen</button>
    </div>
  </div>

  <!-- PRODUCT -->
  <div class="screen" id="s2">
    <div class="top">
      <button class="back" onclick="reset()"><span class="material-symbols-rounded">arrow_back</span> <span data-i="back">Erneut scannen</span></button>
      <div class="prodrow">
        <div class="thumb" id="thumb"></div>
        <div>
          <h1 data-pname>Protein Bar</h1>
          <div class="m" data-pmetaline>€ 2,49 · 50 g · −25 %</div>
        </div>
      </div>
      <div class="langrow" id="langrowProduct"></div>
    </div>
    <div class="body">
      <div class="seg">
        <button id="segNew" class="on" onclick="setSeg('new')" data-i="segNew">Erstkäufer</button>
        <button id="segRet" onclick="setSeg('return')" data-i="segRet">Stammkunde</button>
      </div>
      <div class="hint" id="hint">Wähle, was dich interessiert</div>
      <div class="list" id="list"></div>
      <div class="result" id="result"></div>
    </div>
    <div class="foot">
      <div class="voice"><label data-i="voiceLabel">Stimme</label><select id="voiceSel"></select></div>
      <button class="askbtn" id="askBtn" onclick="startListening()">
        <span class="material-symbols-rounded">mic</span> <span data-i="askBtn">Frage stellen</span>
      </button>
      <button class="play" id="playBtn" onclick="speak()" disabled>
        <span class="material-symbols-rounded">volume_up</span> <span data-i="playBtn">Information anhören</span>
      </button>
    </div>
  </div>
</div>

const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmUpaLCIMK9OnbILTVyUVKzYZpINPDZgjwjiPk0Ble20IelcyTVKw2LKp6-mRxRXVthUvfm_M3-Eop/pub?gid=0&single=true&output=csv";

function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true; else if(c===',') {row.push(cur);cur="";}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";}
      else if(c!=='\r') cur+=c; }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function yesno(v,pos,neg){ return (v||"").trim().toLowerCase()==="ja"
  ? {mark:pos,cls:"ok"} : {mark:neg,cls:"no"}; }

async function loadFromSheet(){
  if(!SHEET_CSV_URL) return; // no sheet configured -> keep built-in data
  try{
    const res = await fetch(SHEET_CSV_URL, {cache:"no-store"});
    if(!res.ok) throw 0;
    const rows = parseCSV(await res.text());
    const head = rows[0].map(h=>h.trim().toLowerCase());
    const idx = n=>head.indexOf(n);
    const rec = rows.slice(1).find(r=>(r[idx("produkt")]||"").trim().toLowerCase()===key);
    if(!rec) return;
    const g=n=>{const i=idx(n); return i>=0?(rec[i]||"").trim():"";};
    P.name=g("name")||P.name;
    const neuPreis = g("neue preis") || g("preis");
    P.price="€ "+(neuPreis||"").replace("€","").trim();
    P.size=g("size")||P.size;
    P.disc=g("rabatt")||P.disc;
    P.link=g("link")||"";
    renderIdentity(P);
    const deData = P.data.de;
    const veg=yesno(g("vegan"),"eco","warning");
    deData.vegan={txt:g("vegan").toLowerCase()==="ja"?"Dieses Produkt ist vegan.":"Dieses Produkt ist nicht vegan.",icon:veg.mark,cls:veg.cls,show:g("vegan").toLowerCase()==="ja"?"Vegan":"Nicht vegan"};
    const hal=yesno(g("halal"),"verified","warning");
    deData.halal={txt:g("halal").toLowerCase()==="ja"?"Dieses Produkt ist halal-zertifiziert.":"Dieses Produkt ist nicht halal-zertifiziert.",icon:hal.mark,cls:hal.cls,show:g("halal").toLowerCase()==="ja"?"Halal-zertifiziert":"Nicht halal"};
    const bio=yesno(g("bio"),"compost","warning");
    deData.bio={txt:g("bio").toLowerCase()==="ja"?"Dieses Produkt trägt das EU-Bio-Siegel.":"Dieses Produkt ist nicht Bio-zertifiziert.",icon:bio.mark,cls:bio.cls,show:g("bio").toLowerCase()==="ja"?"EU-Bio-zertifiziert":"Keine Bio-Zertifizierung"};
    if(g("allergene")) deData.nuts={txt:"Achtung: Dieses Produkt enthält "+g("allergene")+".",icon:"warning",cls:"no",show:"Enthält: "+g("allergene")};
    if(g("naehrwerte")) deData.naehzu={txt:"Nährwerte und Zutaten: "+g("naehrwerte")+".",icon:"nutrition",cls:"ok",show:g("naehrwerte")};
    if(g("verfallsdatum")) deData.date={txt:"Haltbar bis "+g("verfallsdatum")+".",icon:"event",cls:"warn",show:"Haltbar bis "+g("verfallsdatum")};
    if(g("entsorgung")) deData.recycle={txt:"Entsorgung: "+g("entsorgung")+".",icon:"recycling",cls:"ok",show:g("entsorgung")};
    if(g("rating")) deData.rating={txt:"Bewertung: "+g("rating")+" von fünf Sternen.",icon:"star",cls:"ok",show:g("rating")+" / 5,0"};
    if(currentLang==='de'){ DB = P.data.de; if(chosen) refreshResult(); }
  }catch(e){ /* offline or error -> built-in data stays */ }
}

  de:["Anna (Premium)","Anna (Enhanced)","Petra (Premium)","Petra (Enhanced)","Markus (Premium)","Google Deutsch","Microsoft Katja","Microsoft Hedda","Anna","Petra","Markus"],

};

function pick(){
  const code = LANG_META[currentLang].code;
  const prefix = code.split('-')[0];
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(prefix));
  const sel=document.getElementById('voiceSel');
  if(!vs.length){ if(sel) sel.innerHTML=''; best=null; return; }
  best=null;
  const rank = RANK_BY_LANG[currentLang]||[];
  for(const n of rank){const m=vs.find(v=>v.name.includes(n));if(m){best=m;break;}}
  if(!best)best=vs.find(v=>!/compact|eloquence/i.test(v.name))||vs[0];
  if(sel) sel.innerHTML=vs.map(v=>`<option ${v===best?'selected':''}>${v.name}</option>`).join('');
}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=pick;pick();}

  if(!chosen) return;
  const rows=lines();const r=document.getElementById('result');
  r.innerHTML=rows.map(x=>`<div class="rrow ${x.cls}"><span class="material-symbols-rounded">${x.icon}</span><span>${x.show||x.txt}</span></div>`).join('');
}

function speak(){
  const t = UI[currentLang];
  const rows=lines();const r=document.getElementById('result');
  r.innerHTML=`<div class="playing"><span class="bars"><i></i><i></i><i></i><i></i></span> ${t.playing}</div>`+
    rows.map(x=>`<div class="rrow ${x.cls}"><span class="material-symbols-rounded">${x.icon}</span><span>${x.show||x.txt}</span></div>`).join('');
  r.classList.add('show');
  if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(rows.map(x=>x.txt).join(' '));
  const sel=document.getElementById('voiceSel');let v=best;
  if(sel&&sel.value){const f=speechSynthesis.getVoices().find(x=>x.name===sel.value);if(f)v=f;}
  if(v){u.voice=v;u.lang=v.lang;}else u.lang=LANG_META[currentLang].code;
  u.rate=.94;u.pitch=1;
  u.onend=()=>{const p=r.querySelector('.playing');if(p)p.remove();};
  speechSynthesis.speak(u);
}

function matchKeyword(transcript){
  const t = transcript.toLowerCase();
  const map = KEYWORDS_BY_LANG[currentLang];
  for(const k of Object.keys(map)){
    for(const kw of map[k]){
      if(t.includes(kw)) return k;
    }
  }
  return null;
}

function getRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang = LANG_META[currentLang].code;
  r.maxAlternatives = 1;
  r.interimResults = false;
  return r;
}

    return;
  }
  askBtnEl.classList.add('listening');
  const span = askBtnEl.querySelector('[data-i="askBtn"]');
  if(span) span.textContent = t.listening;
  rec.onresult = (e)=>{
    const transcript = e.results[0][0].transcript;
    handleVoiceQuery(transcript);
  };
  rec.onerror = ()=>{ resetAskBtn(); };
  rec.onend = ()=>{ resetAskBtn(); };
  try{ rec.start(); }catch(e){ resetAskBtn(); }
}

async function handleVoiceQuery(transcript){
  const t = UI[currentLang];
  const r = document.getElementById('result');
  r.innerHTML = `<div class="playing"><span class="bars"><i></i><i></i><i></i><i></i></span> ${t.thinking}</div>`;
  r.classList.add('show');

  const aiAnswer = await askAI(transcript);
  if(aiAnswer){
    r.innerHTML = `<div class="rrow ok"><span class="material-symbols-rounded">smart_toy</span><span>${aiAnswer}</span></div>`;
    if('speechSynthesis'in window){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(aiAnswer);
      if(best){u.voice=best;u.lang=best.lang;}else u.lang=LANG_META[currentLang].code;
      u.rate=.94;u.pitch=1;
      speechSynthesis.speak(u);
    }
    return;
  }

  // ---- fallback: local keyword matching (works fully offline) ----
  const key = matchKeyword(transcript);
  if(!key){
    r.innerHTML = `<div class="rrow warn"><span class="material-symbols-rounded">help</span><span>${t.noMatch} ("${transcript}")</span></div>`;
    r.classList.add('show');
    return;
  }
  let targetKey = key, targetSeg = seg;
  if(key==='all'){
    targetKey = seg==='new' ? 'allnew' : 'allret';
  } else {
    if(GROUP_KEYS.new.some(([k])=>k===key)) targetSeg='new';
    else if(GROUP_KEYS.return.some(([k])=>k===key)) targetSeg='return';
  }
  if(targetSeg!==seg) setSeg(targetSeg);
  const btn = document.querySelector(`.opt[data-k="${targetKey}"]`);
  if(btn) sel(btn);
  const note = document.createElement('div');
  note.className = 'rrow warn';
  note.innerHTML = `<span class="material-symbols-rounded">info</span><span>${t.aiUnavailable}</span>`;
  speak();
  setTimeout(()=>{ document.getElementById('result').prepend(note); }, 10);
}

async function askAI(question){
  try{
    const res = await fetch('/.netlify/functions/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        question,
        productName: P.name,
        productData: DB,
        lang: currentLang,
      }),
    });
    if(!res.ok) return null;
    const data = await res.json();
    return data.answer || null;
  }catch(e){
    return null; // offline, function not deployed yet, etc. -> caller falls back to keyword matching
  }
}

// ===== Sprachumschaltung (DE / EN / ES / AR) =====
function renderLangButtons(){
  const html = Object.keys(LANG_META).map(l=>
    `<button class="langbtn ${l===currentLang?'on':''}" onclick="setLang('${l}')">${LANG_META[l].label}</button>`).join('');
  document.getElementById('langrowWelcome').innerHTML = html;
  document.getElementById('langrowProduct').innerHTML = html;
}

function applyStaticText(){
  const t = UI[currentLang];
  document.querySelectorAll('[data-i]').forEach(el=>{
    const key = el.getAttribute('data-i');
    if(t[key]!==undefined) el.textContent = t[key];
  });
  document.getElementById('hint').textContent = seg==='new' ? t.hintNew : t.hintRet;
}

function setLang(l){
  if(!LANG_META[l] || l===currentLang){ if(!LANG_META[l]) return; }
  currentLang = l;
  DB = P.data[l];
  const meta = LANG_META[l];
  document.documentElement.setAttribute('lang', l);
  document.documentElement.setAttribute('dir', meta.dir);
  applyStaticText();
  renderLangButtons();
  render();
  if(chosen) refreshResult();
  if('speechSynthesis'in window){speechSynthesis.cancel();pick();}
}

renderLangButtons();
applyStaticText();
render();
</script>
